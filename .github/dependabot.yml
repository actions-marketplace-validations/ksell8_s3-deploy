version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-toolkit:
        patterns: ["@actions/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Default s3deploy version (see s3deploy-version/go.mod).
  - package-ecosystem: gomod
    directory: /s3deploy-version
    schedule:
      interval: weekly
